<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6FAFE"/><stop offset="1" stop-color="#D3E3F1"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7CADD"/><stop offset="1" stop-color="#7E9AB7"/>
    </linearGradient>
    <linearGradient id="mtLit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2F0DC"/><stop offset="1" stop-color="#BCD6B4"/>
    </linearGradient>
    <linearGradient id="mtShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93B28C"/><stop offset="1" stop-color="#76976F"/>
    </linearGradient>
    <linearGradient id="mtMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFD8B7"/><stop offset="1" stop-color="#A3C29B"/></linearGradient>
    <linearGradient id="mtBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFDDE6"/><stop offset="1" stop-color="#B8CCD8"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.45" cy="0.7" r="0.75">
      <stop offset="0" stop-color="#FCD9C8"/><stop offset="0.55" stop-color="#F5AFA8"/><stop offset="1" stop-color="#E58E8A"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#FFF6E6"/><stop offset="1" stop-color="#FBDDB8"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7B7A8" stop-opacity="0.55"/><stop offset="1" stop-color="#F7B7A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AA4B0"/><stop offset="0.5" stop-color="#5E6874"/><stop offset="1" stop-color="#47505B"/>
    </linearGradient>
    <radialGradient id="face" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4EAF0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="96"/></clipPath>
  </defs>

  <!-- 바탕 타일 -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="url(#rim)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="256" cy="60" rx="230" ry="70" fill="#FFFFFF" opacity="0.55"/>
    <!-- 땅 그림자 -->
    <ellipse cx="256" cy="430" rx="220" ry="26" fill="#7E9AB7" opacity="0.25"/>
  </g>

  <!-- 산 (밝은 면 / 정면 / 그늘 면) -->
  <g filter="url(#sh)">
    <path d="M50 420 L214 200 L196 420 Z" fill="url(#mtLit)"/>
    <path d="M214 200 L196 420 L330 420 Z" fill="url(#mtMid)"/>
    <path d="M214 200 L462 420 L330 420 Z" fill="url(#mtShade)"/>
    <path d="M214 200 L196 420" stroke="#F4FAF1" stroke-width="4" opacity="0.75"/>
    <path d="M214 200 L330 420" stroke="#6F8F6A" stroke-width="3" opacity="0.5"/>
    <path d="M214 200 L176 262 L198 252 L214 272 L232 250 L252 262 Z" fill="#F4FAF1" opacity="0.55"/>
    <path d="M50 420 L214 200 L462 420 Z" fill="none" stroke="#6F8F6A" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <!-- 불꽃 -->
  <circle cx="300" cy="235" r="120" fill="url(#glow)"/>
  <g filter="url(#sh)">
    <path d="M300 104 C344 166 378 194 378 250 C378 298 344 330 300 330 C256 330 222 298 222 252 C222 214 246 194 258 164 C268 194 282 206 294 206 C288 170 290 138 300 104 Z" fill="url(#flame)" stroke="#C0605B" stroke-width="7" stroke-linejoin="round"/>
    <path d="M300 232 C318 254 330 268 330 286 C330 304 316 316 300 316 C284 316 270 304 270 288 C270 268 288 256 300 232 Z" fill="url(#core)" stroke="#D57C72" stroke-width="4"/>
    <path d="M250 232 C248 210 258 196 266 184" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M330 190 C340 204 348 216 350 232" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.45"/>
  </g>

  <!-- 나침반 -->
  <g filter="url(#shSoft)">
    <circle cx="146" cy="146" r="56" fill="url(#bezel)"/>
    <circle cx="146" cy="146" r="44" fill="url(#face)"/>
    <g stroke="#9AA4B0" stroke-width="3" stroke-linecap="round">
      <path d="M146 106 V114"/><path d="M146 178 V186"/><path d="M106 146 H114"/><path d="M178 146 H186"/>
    </g>
    <path d="M146 110 L146 146 L134 146 Z" fill="#E08A85"/>
    <path d="M146 110 L158 146 L146 146 Z" fill="#B85450"/>
    <path d="M146 182 L146 146 L158 146 Z" fill="#8A8F98"/>
    <path d="M146 182 L134 146 L146 146 Z" fill="#B3B8C0"/>
    <circle cx="146" cy="146" r="5" fill="#5B6470"/>
    <path d="M112 128 A40 40 0 0 1 152 104" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
